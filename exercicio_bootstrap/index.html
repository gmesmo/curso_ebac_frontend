<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercicio Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="card col-8 m-5">
          <h1 class="text-center">Formulário Bootstrap</h1>
          <form>
            <label for="nome" class="form-label">Seu nome:</label>
            <input id="nome" type="text" class="form-control" />
            <label for="email" class="form-label">Seu email:</label>
            <input id="email" type="email" class="form-control" />
            <label for="telefone" class="form-label">Seu telefone:</label>
            <input id="telefone" type="text" class="form-control" />

            <button type="submit" class="btn btn-success col-12 my-2">
              Enviar
            </button>
          </form>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
